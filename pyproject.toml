[project]
name = "lstk-eye"
version = "0.1.0"
description = "AI laser pointer for the real world: DIY HUD glasses (ESP32-S3 camera + OLED) driven by a laptop server running SAM segmentation and Claude vision"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["wearable", "hud", "esp32", "sam", "claude", "augmented-reality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
seg = ["ultralytics>=8.2"]
full = ["lstk-eye[stt,seg]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
lstk-eye = "lstk_eye.cli:main"

[project.urls]
Homepage = "https://github.com/lstk-eye/lstk-eye"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lstk_eye"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that download or run real ML models (deselect with '-m \"not slow\"')",
]
